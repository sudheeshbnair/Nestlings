<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>Nestlings Premium Preschool</title>
        <link rel="icon" type="image/png" href="img/tab.png">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="" name="keywords">
        <meta content="" name="description">

        <!-- Google Web Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"> 

        <!-- Icon Font Stylesheet -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>

        <!-- Libraries Stylesheet -->
        <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">

        <!-- Customized Bootstrap Stylesheet -->
        <link href="css/bootstrap.min.css" rel="stylesheet">

        <!-- Template Stylesheet -->
        <link href="css/style.css" rel="stylesheet">

        <!-- Nestlings visual system (loads after style.css) -->
        <link href="css/nestlings-theme.css" rel="stylesheet">
        <link rel="preload" as="image" href="img/banner-sm.webp" media="(max-width: 767.98px)">
        <link rel="preload" as="image" href="img/banner.webp" media="(min-width: 768px)">
        <script src="js/reveal.js"></script>

        

    </head>

    <body>

        <site-header active="gallery.html"></site-header>


        <!-- Modal Search Start -->
        <!-- Modal Search End -->


        <!-- Page Header Start -->
        <div class="container-fluid page-header py-5 wow fadeIn" data-wow-delay="0.1s">
            <div class="container text-center py-5">
                <h1 class="display-2 text-white mb-0">Gallery</h1>
            </div>
        </div>
        <!-- Page Header End -->


        <!-- About Start -->
        <div class="container-fluid events py-5 bg-light">
            <div class="container py-5">
                <div class="mx-auto text-center wow fadeIn" data-wow-delay="0.1s" style="max-width: 700px;">
                    <h4 class="text-primary mb-4 border-bottom border-primary border-2 d-inline-block p-2 title-border-radius">Snaps</h4>
                </div>
                <div class="gallery-grid">
                    <a class="gallery-item wow fadeIn" href="img/gallery/1.webp" data-lightbox="gallery" data-title="Front of the Nestlings Premium Preschool building with a colourful painted boundary wall">
                        <img src="img/gallery/1.webp" width="500" height="688" loading="lazy" alt="Front of the Nestlings Premium Preschool building with a colourful painted boundary wall">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                    <a class="gallery-item wow fadeIn" href="img/gallery/2.webp" data-lightbox="gallery" data-title="Side view of the preschool building and its pink, yellow and blue compound wall">
                        <img src="img/gallery/2.webp" width="500" height="688" loading="lazy" alt="Side view of the preschool building and its pink, yellow and blue compound wall">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                    <a class="gallery-item wow fadeIn" href="img/gallery/3.webp" data-lightbox="gallery" data-title="Welcome mural at the entrance with the Nestlings logo, a squirrel and a rainbow">
                        <img src="img/gallery/3.webp" width="500" height="688" loading="lazy" alt="Welcome mural at the entrance with the Nestlings logo, a squirrel and a rainbow">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                    <a class="gallery-item wow fadeIn" href="img/gallery/4.webp" data-lightbox="gallery" data-title="Reception and office area with wooden panelling and two blue chairs">
                        <img src="img/gallery/4.webp" width="500" height="688" loading="lazy" alt="Reception and office area with wooden panelling and two blue chairs">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                    <a class="gallery-item wow fadeIn" href="img/gallery/5.webp" data-lightbox="gallery" data-title="Classroom with a yellow table, small yellow chairs and a toy shelf">
                        <img src="img/gallery/5.webp" width="500" height="688" loading="lazy" alt="Classroom with a yellow table, small yellow chairs and a toy shelf">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                    <a class="gallery-item wow fadeIn" href="img/gallery/6.webp" data-lightbox="gallery" data-title="Classroom with a round red table, red chairs and cheerful wall stickers">
                        <img src="img/gallery/6.webp" width="500" height="688" loading="lazy" alt="Classroom with a round red table, red chairs and cheerful wall stickers">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                    <a class="gallery-item wow fadeIn" href="img/gallery/7.webp" data-lightbox="gallery" data-title="Classroom with a green table and green chairs">
                        <img src="img/gallery/7.webp" width="500" height="688" loading="lazy" alt="Classroom with a green table and green chairs">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                </div>

                <!-- Landscape photos: own row at the end -->
                <div class="gallery-wide">
                    <a class="gallery-item wow fadeIn" href="img/gallery/8.webp" data-lightbox="gallery" data-title="Covered rooftop play area with artificial grass, slides and see-saws">
                        <img src="img/gallery/8.webp" width="688" height="500" loading="lazy" alt="Covered rooftop play area with artificial grass, slides and see-saws">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                    <a class="gallery-item wow fadeIn" href="img/gallery/9.webp" data-lightbox="gallery" data-title="Rooftop play area with a slide, ride-on toys and a cartoon wall mural">
                        <img src="img/gallery/9.webp" width="688" height="500" loading="lazy" alt="Rooftop play area with a slide, ride-on toys and a cartoon wall mural">
                        <span class="gallery-zoom" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
                    </a>
                </div>
            </div>
        </div>

        <!-- About End -->


        <site-footer></site-footer>

        
    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/lightbox/js/lightbox.min.js"></script>
    <script>if (window.lightbox) { lightbox.option({ wrapAround: true, albumLabel: "Photo %1 of %2", resizeDuration: 200, fadeDuration: 250 }); }</script>

    <!-- Shared header/footer components (must load before main.js) -->
    <script src="js/shared-component.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>

</html>
